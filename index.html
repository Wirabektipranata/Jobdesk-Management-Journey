<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />

    <!-- Responsive Configuration -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <!-- Website Identity -->
    <title>JourneyFX Workspace | Jobdesk Management System</title>

    <meta name="description"
          content="JourneyFX Workspace - Internal management system for task assignments, project management, PIC responsibilities, team scheduling, performance monitoring, and operational reporting." />

    <meta name="author" content="JourneyFX Management" />

    <!-- Privacy Configuration -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!-- Theme Configuration -->
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />

    <!-- Mobile Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent" />
    <meta name="apple-mobile-web-app-title"
          content="JourneyFX Workspace" />

    <!-- Initial Website Styling -->
    <style>
        :root {
            color-scheme: dark;
            --background: #0B0D10;
            --surface: #15191E;
            --border: #30353C;
            --silver: #D1D5DB;
            --text: #F5F5F5;
            --muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Inter, Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .workspace-loader {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
        }

        .workspace-logo {
            font-size: 64px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(
                135deg,
                #FFFFFF,
                #A6ABB2,
                #FFFFFF
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .workspace-title {
            margin-top: 12px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .workspace-subtitle {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .loading-spinner {
            width: 30px;
            height: 30px;
            margin-top: 28px;
            border: 2px solid #30353C;
            border-top-color: #E5E7EB;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 12px;
            color: var(--muted);
        }

        .workspace-footer {
            margin-top: 40px;
            font-size: 11px;
            color: #777E87;
        }

        .error-message {
            display: none;
            margin-top: 24px;
            max-width: 420px;
            color: #FCA5A5;
            font-size: 13px;
            line-height: 1.6;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner {
                animation: none;
            }
        }

        @media (max-width: 600px) {
            .workspace-logo {
                font-size: 52px;
            }

            .workspace-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- JavaScript Disabled Notification -->
    <noscript>
        <div style="padding: 40px; text-align: center;">
            <h2>JourneyFX Workspace</h2>
            <p>
                Aktifkan JavaScript pada browser Anda
                untuk menggunakan sistem ini.
            </p>
        </div>
    </noscript>

    <!-- React Application Root -->
    <div id="root">

        <!-- Initial Loading Screen -->
        <div class="workspace-loader">

            <div class="workspace-logo">J.</div>

            <div class="workspace-title">
                JourneyFX Workspace
            </div>

            <div class="workspace-subtitle">
                JOBDESK MANAGEMENT SYSTEM
            </div>

            <div
                class="loading-spinner"
                aria-hidden="true">
            </div>

            <div
                class="loading-text"
                role="status"
                aria-live="polite">
                Initializing workspace...
            </div>

            <div
                id="startup-error"
                class="error-message"
                role="alert">
                Workspace belum berhasil dimuat.
                Pastikan source code dan konfigurasi
                aplikasi sudah tersedia.
            </div>

            <div class="workspace-footer">
                JourneyFX &copy; 2026–2027
                | Internal Management System
            </div>

        </div>

    </div>

    <!-- Application Startup Monitoring -->
    <script>
        window.setTimeout(function () {
            const errorMessage =
                document.getElementById("startup-error");

            if (errorMessage) {
                errorMessage.style.display = "block";

                const spinner =
                    document.querySelector(".loading-spinner");

                const loadingText =
                    document.querySelector(".loading-text");

                if (spinner) {
                    spinner.style.display = "none";
                }

                if (loadingText) {
                    loadingText.textContent =
                        "Workspace initialization incomplete.";
                }
            }
        }, 15000);
    </script>

    <!-- Main React Application -->
    <script type="module" src="/src/main.tsx"></script>

</body>
</html>
